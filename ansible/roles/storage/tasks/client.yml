---
# ansible/roles/storage/tasks/client.yml

- name: "Instalar cliente GlusterFS"
  apt:
    name: glusterfs-client
    state: present
    update_cache: "{{ internet_available | default(false) }}"

- name: "Añadir storage-node a /etc/hosts para que GlusterFS pueda resolverlo"
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[groups['storage'][0]]['ansible_host'] }} {{ groups['storage'][0] }}"
    state: present

- name: "Crear punto de montaje para el CMS"
  file:
    # Esta es la ruta donde los servidores web verán los archivos compartidos.
    path: /var/www/cms_shared
    state: directory
    mode: '0775'
    owner: www-data
    group: www-data

- name: "Montar el volumen GlusterFS en los frontales"
  mount:
    path: /var/www/cms_shared
    # Resolvemos dinámicamente la IP del nodo de almacenamiento
    src: "{{ hostvars[groups['storage'][0]]['ansible_host'] }}:/gv0"
    fstype: glusterfs
    opts: defaults,_netdev
    state: mounted

---
# ============================================================
# Rol: common — Tareas base para TODOS los nodos
# Requisitos: 9 (Seguridad/UFW)
# ============================================================

- name: "RED: Comprobar conectividad a Internet (repositorio Ubuntu)"
  ansible.builtin.wait_for:
    host: archive.ubuntu.com
    port: 80
    timeout: 3
  register: internet_check
  ignore_errors: yes
  changed_when: false

- name: "RED: Establecer flag de conectividad a Internet"
  ansible.builtin.set_fact:
    internet_available: "{{ internet_check is succeeded }}"

# ------------------------------------------------------------
# 1. SEGURIDAD (UFW)
# ------------------------------------------------------------
- name: "UFW: Instalar firewall"
  ansible.builtin.apt:
    name: ufw
    state: present

- name: "UFW: Política por defecto — denegar entrada, permitir salida"
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: allow }

- name: "UFW: Permitir SSH (administración)"
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: "UFW: Permitir CheckMK Agent (puerto 6556)"
  community.general.ufw:
    rule: allow
    port: '6556'
    proto: tcp
  when: "inventory_hostname != 'monitoring'"

- name: "UFW: Habilitar el firewall"
  community.general.ufw:
    state: enabled



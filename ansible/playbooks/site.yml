---
# ==============================================================
# GAR — Fase 2: Configuración de Servicios
# Playbook principal: llama a cada rol sobre sus nodos.
#
# Uso:
#   ansible-playbook -i inventory/hosts.yml site.yml
#
# Para ejecutar solo un rol:
#   ansible-playbook -i inventory/hosts.yml site.yml --tags loadbalancer
# ==============================================================

# ── Rol 0: Base / Security / Monitoring ───────────────────────
- name: "Rol 0 — Tareas comunes (UFW y SNMP)"
  hosts: all
  become: yes
  roles:
    - role: common
  tags: common

# ── Rol 1: Network & Edge Security ────────────────────────────
- name: "Rol 1 — Load Balancer (Nginx + NAT + UFW)"
  hosts: load-balancer
  become: yes
  roles:
    - role: load-balancer
  tags: load-balancer

# ── Rol 2: Storage & Redundancy (GlusterFS) ───────────────────
- name: "Rol 2 — Almacenamiento compartido (GlusterFS)"
  hosts: storage, web-frontend
  become: yes
  roles:
    - role: storage
  tags: storage

# ── Rol 3: Clustering & Database HA ───────────────────────────
- name: "Rol 3 — Docker Swarm + Base de datos HA"
  hosts: cluster-node
  become: yes
  roles:
    - role: cluster-node
  tags: cluster-node

# ── Rol 4: Web Layer & CMS ────────────────────────────────────
- name: "Rol 4 — Web Frontends (Nginx + CMS)"
  hosts: web-frontend
  become: yes
  roles:
    - role: web-frontend
  tags: web-frontend

# ── Rol 5: Observability ────────────────────────────────────────
- name: "Rol 5 — Monitorización (CheckMK + SNMP)"
  hosts: monitoring
  become: yes
  roles:
    - role: monitoring
  tags: monitoring

# ── Rol 6: Hotdesks ───────────────────────────────────────────
- name: "Rol 6 — Puestos de trabajo (Hotdesks)"
  hosts: hotdesk
  become: yes
  roles:
    - role: hotdesk
  tags: hotdesk

# ── Rol 7: Security Lockdown y Relevo de Red ──────────────────
- name: "Rol 7 — Seguridad final (Sudo Lockdown y Cambio de Enrutamiento)"
  hosts: all
  become: yes
  vars_files:
    - "../../config/networks.yml"
  tasks:
    - name: "RED: Eliminar gateway antiguo de cloud-init (Nodos Main)"
      replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '^\s*gateway4:.*$'
        replace: ''
      when: "inventory_hostname in groups['web-frontend'] or inventory_hostname in groups['hotdesk']"

    - name: "RED: Eliminar gateway antiguo de cloud-init (Nodos Internal)"
      replace:
        path: /etc/netplan/50-cloud-init.yaml
        regexp: '^\s*gateway4:.*$'
        replace: ''
      when: "inventory_hostname in groups['cluster-node'] or inventory_hostname in groups['storage'] or inventory_hostname in groups['monitoring']"

    - name: "RED: Cambiar Default Gateway al Load Balancer (Nodos Main)"
      copy:
        dest: /etc/netplan/99-gateway-override.yaml
        content: |
          network:
            version: 2
            ethernets:
              enp0s3:
                routes:
                  - to: default
                    via: {{ (networks | selectattr('name', 'equalto', 'intnet_main') | first).final_gateway }}
      when: "inventory_hostname in groups['web-frontend'] or inventory_hostname in groups['hotdesk']"

    - name: "RED: Cambiar Default Gateway al Load Balancer (Nodos Internal)"
      copy:
        dest: /etc/netplan/99-gateway-override.yaml
        content: |
          network:
            version: 2
            ethernets:
              enp0s3:
                routes:
                  - to: default
                    via: {{ (networks | selectattr('name', 'equalto', 'intnet_internal') | first).final_gateway }}
      when: "inventory_hostname in groups['cluster-node'] or inventory_hostname in groups['storage'] or inventory_hostname in groups['monitoring']"

    - name: "RED: Aplicar nueva ruta por defecto"
      command: netplan apply
      when: "inventory_hostname != 'load-balancer'"
  tags: lockdown

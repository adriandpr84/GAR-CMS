---
# ==============================================================
# GAR — Fase 2: Configuración de Servicios
# Playbook principal: llama a cada rol sobre sus nodos.
#
# Uso:
#   ansible-playbook -i inventory/hosts.yml site.yml
#
# Para ejecutar solo un rol:
#   ansible-playbook -i inventory/hosts.yml site.yml --tags loadbalancer
# ==============================================================

# ── Rol 0: Base / Security / Monitoring ───────────────────────
- name: "Rol 0 — Tareas comunes (UFW y SNMP)"
  hosts: all
  become: yes
  roles:
    - role: common
  tags: common

# ── Rol 1: Network & Edge Security ────────────────────────────
- name: "Rol 1 — Load Balancer (Nginx + NAT + UFW)"
  hosts: load-balancer
  become: yes
  roles:
    - role: load-balancer
  tags: load-balancer

# ── Rol 2: Storage & Redundancy (GlusterFS) ───────────────────
- name: "Rol 2 — Almacenamiento compartido (GlusterFS)"
  hosts: storage, web-frontend
  become: yes
  roles:
    - role: storage
  tags: storage

# ── Rol 3: Clustering & Database HA ───────────────────────────
- name: "Rol 3 — Docker Swarm + Base de datos HA"
  hosts: cluster-node
  become: yes
  roles:
    - role: cluster-node
  tags: cluster-node

# ── Rol 4: Web Layer & CMS ────────────────────────────────────
- name: "Rol 4 — Web Frontends (Nginx + CMS)"
  hosts: web-frontend
  become: yes
  roles:
    - role: web-frontend
  tags: web-frontend

# ── Rol 5: Observability ────────────────────────────────────────
- name: "Rol 5 — Monitorización (CheckMK + SNMP)"
  hosts: monitoring
  become: yes
  roles:
    - role: monitoring
  tags: monitoring

# ── Rol 6: Hotdesks ───────────────────────────────────────────
- name: "Rol 6 — Puestos de trabajo (Hotdesks)"
  hosts: hotdesk
  become: yes
  roles:
    - role: hotdesk
  tags: hotdesk

# ── Rol 7: Security Lockdown ──────────────────────────────────
- name: "Rol 7 — Seguridad final (Sudo Lockdown)"
  hosts: all
  become: yes
  tasks:
    - name: "SEGURIDAD: Eliminar permisos NOPASSWD temporales de sudo"
      file:
        path: "/etc/sudoers.d/99-{{ ansible_user }}-nopasswd"
        state: absent
  tags: lockdown

---
# ==============================================================
# GAR — Fase 2: Configuración de Servicios
# Playbook principal: llama a cada rol sobre sus nodos.
#
# Uso:
#   ansible-playbook -i inventory/hosts.yml site.yml
#
# Para ejecutar solo un rol:
#   ansible-playbook -i inventory/hosts.yml site.yml --tags loadbalancer
# ==============================================================

# ── Rol 0: Base / Security / Monitoring ───────────────────────
- name: "Rol 0 — Tareas comunes (UFW)"
  hosts: all
  become: yes
  roles:
    - role: common
  tags: common

# ── Rol 1: Network & Edge Security ────────────────────────────
- name: "Rol 1 — Load Balancer (Nginx + NAT + UFW)"
  hosts: load-balancer
  become: yes
  roles:
    - role: load-balancer
  tags: load-balancer

# ── Rol 2: Storage & Redundancy (GlusterFS) ───────────────────
- name: "Rol 2 — Almacenamiento compartido (GlusterFS)"
  hosts: storage, web-frontend
  become: yes
  roles:
    - role: storage
  tags: storage

# ── Rol 3: Clustering & Database HA ───────────────────────────
- name: "Rol 3 — Docker Swarm + Base de datos HA"
  hosts: cluster-node
  become: yes
  roles:
    - role: cluster-node
  tags: cluster-node

# ── Rol 4: Web Layer & CMS ────────────────────────────────────
- name: "Rol 4 — Web Frontends (Nginx + CMS)"
  hosts: web-frontend
  become: yes
  roles:
    - role: web-frontend
  tags: web-frontend

# ── Rol 5: Observability ────────────────────────────────────────
- name: "Rol 5 — Monitorización (CheckMK)"
  hosts: monitoring
  become: yes
  roles:
    - role: monitoring
  tags: monitoring

# ── Agente CheckMK en todos los nodos ─────────────────────────
- name: "CheckMK Agent — Instalar agente nativo en todos los nodos"
  hosts: all
  become: yes
  roles:
    - role: checkmk-agent
  tags:
    - common
    - checkmk-agent

# ── Rol 6: Hotdesks ──────────────────
- name: "Rol 6 — Puestos de trabajo (Hotdesks)"
  hosts: hotdesk
  become: yes
  roles:
    - role: hotdesk
  tags: hotdesk

# ── Rol 7: Security Lockdown y Relevo de Red ──────────────────
- name: "Rol 7 — Seguridad final (Sudo Lockdown y Cambio de Enrutamiento)"
  hosts: all
  become: yes
  vars_files:
    - "../../config/networks.yml"
  tasks:
    - name: "RED: Cambio de Gateway por defecto hacia el Load Balancer"
      when: "inventory_hostname != 'load-balancer'"
      block:
        - name: "RED: Eliminar gateway antiguo de cloud-init"
          ansible.builtin.replace:
            path: /etc/netplan/50-cloud-init.yaml
            regexp: '^\s*gateway4:.*$'
            replace: ''

        - name: "RED: Escribir override de netplan con el nuevo gateway del Load Balancer"
          ansible.builtin.copy:
            dest: /etc/netplan/99-gateway-override.yaml
            content: |
              network:
                version: 2
                ethernets:
                  enp0s3:
                    routes:
                      - to: default
                        via: {{ gateway_ip }}
          vars:
            gateway_ip: "{{ (networks | selectattr('name', 'equalto', (inventory_hostname in groups['web-frontend'] or inventory_hostname in groups['hotdesk']) | ternary('intnet_main', 'intnet_internal')) | first).final_gateway }}"

        - name: "RED: Aplicar nueva configuracion de netplan"
          ansible.builtin.command: netplan apply
          changed_when: true
  tags: lockdown

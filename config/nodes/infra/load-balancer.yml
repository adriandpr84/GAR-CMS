name: load-balancer
type: load-balancer
mac: "08:00:27:00:01:0A"
networks:
  - name: intnet_main
    ip: "192.168.1.10"
    gateway: ""
    # Sin gateway aquí: la ruta por defecto del LB sale por la interfaz NAT (enp0s8).
    # Esto permite que el LB haga NAT para toda la red main.
  - name: NAT
    type: nat
  - name: intnet_internal
    ip: "192.168.2.20"
    gateway: ""
  - name: vboxnet0
    type: hostonly
    ip: "192.168.56.11"


---
# ============================================================
# Rol: gateway-switch — Tareas
# Propósito: Cambia el default gateway en Netplan del jumpstart
#            al load-balancer para asegurar el ruteo definitivo.
# ============================================================

- name: "NETPLAN: Cambiar gateway en main (de 192.168.1.254 a 192.168.1.10)"
  ansible.builtin.replace:
    path: /etc/netplan/50-cloud-init.yaml
    regexp: 'gateway4:\s*192\.168\.1\.254'
    replace: 'gateway4: 192.168.1.10'
  register: netplan_main

- name: "NETPLAN: Cambiar gateway en internal (de 192.168.2.254 a 192.168.2.10)"
  ansible.builtin.replace:
    path: /etc/netplan/50-cloud-init.yaml
    regexp: 'gateway4:\s*192\.168\.2\.254'
    replace: 'gateway4: 192.168.2.10'
  register: netplan_internal

- name: "NETPLAN: Aplicar cambios de red"
  command: netplan apply
  when: netplan_main.changed or netplan_internal.changed

---
# ==============================================================
# Rol: checkmk-agent — Instalar agente nativo en los clientes
# ==============================================================

- name: "Instalación del Agente (Nodos no monitoreados por sí mismos)"
  when: "inventory_hostname != 'monitoring'"
  block:
    - name: "CheckMK Agent: Descargar .deb desde el servidor CheckMK interno"
      ansible.builtin.get_url:
        url: "http://192.168.2.30/monitoring/check_mk/agents/check-mk-agent_{{ hostvars['monitoring']['checkmk_version'] | default('2.3.0p47') }}-1_all.deb"
        dest: /tmp/check-mk-agent.deb
        mode: '0644'

    - name: "CheckMK Agent: Instalar agente con dpkg"
      ansible.builtin.apt:
        deb: /tmp/check-mk-agent.deb
        state: present

    - name: "CheckMK Agent: Habilitar y arrancar el socket del agente (puerto 6556)"
      ansible.builtin.service:
        name: check-mk-agent.socket
        state: started
        enabled: yes
      ignore_errors: yes

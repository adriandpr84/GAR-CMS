---
# ==============================================================
# 1. GESTIÓN DE AGENTES Y ELIMINACIÓN DE SNMP (Para todos los nodos)
# ==============================================================

# Las dependencias de agente SNMP han sido eliminadas. Ahora se desinstala SNMP y se usa
# el agente nativo de CheckMK (puerto 6556 tcp) en todos los nodos.
# La instalación del agente se realiza en un play dedicado dentro de site.yml para todos los nodos.





# ==============================================================
# 3. BLOQUE ESPECÍFICO: SOLO PARA EL SERVIDOR MONITORING
# ==============================================================

- name: "[CheckMK] Instalar motor Docker y dependencias en el nodo de monitoreo"
  ansible.builtin.apt:
    name: 
      - docker.io
      - python3-docker
    state: present
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Asegurar que el demonio de Docker este activo"
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes
  when: "inventory_hostname == 'monitoring'"

- name: "UFW: Abrir puerto HTTP (80) para CheckMK"
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Desplegar el contenedor oficial de CheckMK Raw"
  community.docker.docker_container:
    name: checkmk-server
    image: checkmk/check-mk-raw:2.3.0-latest
    state: started
    restart_policy: always
    ports:
      - "80:5000"
    volumes:
      - /opt/omd/sites:/opt/omd/sites
    env:
      CMK_PASSWORD: "admin-gar-2026"
      CMK_SITE_ID: "monitoring"
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Esperar a que la API de CheckMK esté disponible"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/host_config/collections/all"
    method: GET
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
  register: check_api
  until: check_api.status == 200
  retries: 30
  delay: 5
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Registrar nodos del inventario en CheckMK"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/host_config/collections/all"
    method: POST
    timeout: 120
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      folder: "/"
      host_name: "{{ item }}"
      attributes:
        ipaddress: "{{ hostvars[item]['ansible_host'] }}"
        tag_agent: "cmk-agent"
        tag_snmp_ds: "no-snmp"
    status_code: [200, 201, 400, 409]
  loop: "{{ groups['all'] }}"
  when: "inventory_hostname == 'monitoring' and item != 'monitoring' and item != 'jumpstart'"

- name: "[CheckMK] Actualizar atributos de hosts ya existentes (cmk-agent + no-snmp)"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/objects/host_config/{{ item }}"
    method: PUT
    timeout: 120
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
      If-Match: "*"
    body_format: json
    body:
      attributes:
        ipaddress: "{{ hostvars[item]['ansible_host'] }}"
        tag_agent: "cmk-agent"
        tag_snmp_ds: "no-snmp"
    status_code: [200, 204]
  loop: "{{ groups['all'] }}"
  when: "inventory_hostname == 'monitoring' and item != 'monitoring' and item != 'jumpstart'"
  ignore_errors: yes

- name: "[CheckMK] Obtener reglas de descubrimiento de procesos existentes"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/rule/collections/all?ruleset_name=inventory_processes_rules"
    method: GET
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
  register: existing_rules
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Crear reglas de descubrimiento de procesos si no existen"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/rule/collections/all"
    method: POST
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      ruleset: "inventory_processes_rules"
      folder: "/"
      properties:
        description: "Discover {{ item }} process"
      value_raw: " {'match': '~.*{{ item }}.*', 'descr': 'Process {{ item }}', 'user': False, 'default_params': {'levels': (1, 1, 99, 99), 'cpu_rescale_max': False}}"
      conditions:
        host_tags: []
        host_label_groups: []
        service_label_groups: []
    status_code: [200, 201]
  loop:
    - nginx
    - dockerd
    - glusterd
    - mysqld
    - php-fpm
  when: >
    inventory_hostname == 'monitoring' and
    (existing_rules.json.value | default([]) | selectattr('extensions.properties.description', 'defined') | selectattr('extensions.properties.description', 'equalto', 'Discover ' ~ item ~ ' process') | list | length == 0)



- name: "[CheckMK] Obtener ETag de cambios pendientes (pre-descubrimiento)"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/activation_run/collections/pending_changes"
    method: GET
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
  register: pending_changes_pre
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Activar cambios de las nuevas reglas de procesos"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/activation_run/actions/activate-changes/invoke"
    method: POST
    timeout: 120
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
      If-Match: "{{ pending_changes_pre.etag | default('') }}"
    body_format: json
    body:
      redirect: false
      sites: []
      force_foreign_changes: true
    status_code: [200, 201, 204]
  when: "inventory_hostname == 'monitoring' and pending_changes_pre is succeeded and pending_changes_pre.json.value | length > 0"


- name: "[CheckMK] Lanzar descubrimiento de servicios para los nodos registrados"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/service_discovery_run/actions/start/invoke"
    method: POST
    timeout: 120
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      host_name: "{{ item }}"
      mode: "tabula_rasa"
    status_code: [200, 201, 204]
  loop: "{{ groups['all'] }}"
  when: "inventory_hostname == 'monitoring' and item != 'monitoring' and item != 'jumpstart'"
  ignore_errors: yes

- name: "[CheckMK] Obtener ETag de cambios pendientes"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/activation_run/collections/pending_changes"
    method: GET
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
  register: pending_changes_res
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Activar cambios pendientes"
  ansible.builtin.uri:
    url: "http://localhost/monitoring/check_mk/api/1.0/domain-types/activation_run/actions/activate-changes/invoke"
    method: POST
    timeout: 120
    headers:
      Authorization: "Bearer cmkadmin admin-gar-2026"
      Accept: "application/json"
      Content-Type: "application/json"
      If-Match: "{{ pending_changes_res.etag | default('') }}"
    body_format: json
    body:
      redirect: false
      sites: []
      force_foreign_changes: true
    status_code: [200, 201, 204]
  when: "inventory_hostname == 'monitoring' and pending_changes_res is succeeded"

- name: "[CheckMK] Obtener la version exacta de CheckMK instalada"
  ansible.builtin.shell: "docker exec checkmk-server omd version | awk '{print $NF}' | sed 's/\\.cre//'"
  register: omd_version_cmd
  changed_when: false
  when: "inventory_hostname == 'monitoring'"

- name: "[CheckMK] Establecer fact con la version de CheckMK"
  ansible.builtin.set_fact:
    checkmk_version: "{{ omd_version_cmd.stdout | trim }}"
  when: "inventory_hostname == 'monitoring'"

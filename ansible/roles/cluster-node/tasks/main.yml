---
# ==============================================================
# Rol 3 — Docker Swarm + Base de Datos HA
# ==============================================================

- name: "Docker: instalar y preparar Docker en todos los nodos"
  import_tasks: docker.yml

- name: "UFW: Abrir puertos para Docker Swarm y Galera"
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: '2377', proto: 'tcp' }
    - { port: '7946', proto: 'tcp' }
    - { port: '7946', proto: 'udp' }
    - { port: '4789', proto: 'udp' }
    - { port: '3306', proto: 'tcp' }
    - { port: '4567', proto: 'tcp' }
    - { port: '4567', proto: 'udp' }
    - { port: '4568', proto: 'tcp' }
    - { port: '4444', proto: 'tcp' }

- name: "Swarm: crear el clúster y unir managers/workers"
  import_tasks: swarm.yml

- name: "Database HA: desplegar MariaDB Galera en Docker Swarm"
  import_tasks: database.yml

- name: "Verificación: mostrar estado final del rol"
  import_tasks: verify.yml

---
# ==============================================================
# Rol 6: Puestos de trabajo (Hotdesks)
# ==============================================================

- name: "[Hotdesks] Crear el usuario de sistema para alumnos"
  ansible.builtin.user:
    name: alumno
    comment: "Usuario Estudiante GAR"
    shell: /bin/bash
    groups: sudo
    append: yes

- name: "[Hotdesks] Instalar herramientas esenciales de diagnostico de red"
  ansible.builtin.apt:
    name:
      - curl
      - net-tools
      - traceroute
      - tmux
    state: present

- name: "[Hotdesks] Copiar script de TrafficMix a la home del administrador"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../trafficmix.py"
    dest: "/home/admin/trafficmix.py"
    owner: admin
    group: admin
    mode: '0755'

- name: "[Hotdesks] Copiar script de TrafficMix a la home de alumno"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../trafficmix.py"
    dest: "/home/alumno/trafficmix.py"
    owner: alumno
    group: alumno
    mode: '0755'
